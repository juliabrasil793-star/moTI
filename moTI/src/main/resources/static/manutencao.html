<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>moTI — Manutenções</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="img/gear.png">
</head>

<body>

    <div class="background"></div>

    <aside class="menu">
        <nav>
            <a href="index.html" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span>Listar</span>
            </a>

            <a href="cadastro.html" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Cadastrar</span>
            </a>

            <a href="manutencao.html" class="menu-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path
                        d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                    </path>
                </svg>
                <span>Manutenções</span>
            </a>

            <a href="locais.html" class="menu-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
                <span>Locais</span>
            </a>
        </nav>
    </aside>

    <main class="conteudo">
        <div class="conteudo-full">
            <h1 class="titulo">Manutenções</h1>

            <form id="form-manutencao">
                <label for="equipamento">Equipamento</label>
                <select id="equipamento" required>
                    <option value="">Selecione...</option>
                </select>

                <label for="dataAbertura">Data de abertura</label>
                <input type="date" id="dataAbertura" required>

                <label for="dataResolucao">Data de resolução</label>
                <input type="date" id="dataResolucao">

                <label for="problema">Problema</label>
                <textarea id="problema" rows="3" placeholder="Ex: não liga após queda de energia" required></textarea>

                <label for="solucao">Solução</label>
                <textarea id="solucao" rows="3" placeholder="Ex: troca da fonte"></textarea>

                <label for="status">Status</label>
                <select id="status">
                    <option value="ABERTA">Aberta</option>
                    <option value="EM_ANDAMENTO">Em andamento</option>
                    <option value="RESOLVIDA">Resolvida</option>
                </select>

                <button type="submit">Registrar manutenção</button>

                <div id="mensagem" class="mensagem"></div>
            </form>

            <h1 class="titulo" style="margin-top:48px;">Histórico <span>do equipamento</span></h1>

            <table>
                <thead>
                    <tr>
                        <th>Abertura</th>
                        <th>Resolução</th>
                        <th>Problema</th>
                        <th>Solução</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-manutencoes"></tbody>
            </table>

            <div id="vazio-manutencoes" class="vazio">
                Selecione um equipamento para ver o histórico.
            </div>
        </div>
    </main>

    <script src="js/manutencao.js"></script>

</body>

</html>
